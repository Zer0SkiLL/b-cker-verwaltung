name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Pakete für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: Abhängigkeiten
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ui install --frozen-lockfile

      - name: Oberfläche bauen (wird ins Programm eingebettet)
        run: pnpm --dir ui build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust-Tests
        run: cargo test --workspace
      - name: Oberflächen-Tests
        run: pnpm --dir ui exec vitest run
      - name: Typprüfung
        run: pnpm --dir ui check
      - name: Skript-Tests
        run: node --test "scripts/*.test.mjs"

  e2e:
    name: E2E (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Windows vorerst nicht: msedgedriver/WebView2 startet auf den GitHub-Runnern keine Sitzung
        # ("DevToolsActivePort file doesn't exist"). Kernabläufe dort manuell prüfen.
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Pakete für Tauri und WebDriver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev webkit2gtk-driver xvfb

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Abhängigkeiten
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir e2e install --frozen-lockfile

      - name: tauri-driver
        run: cargo install tauri-driver --locked

      - name: Edge-WebDriver passend zu WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          "NATIVE_DRIVER=$PWD\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Programm bauen (Debug)
        run: pnpm tauri build --debug --no-bundle

      - name: E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run pnpm --dir e2e test
      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: pnpm --dir e2e test
