name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  notes:
    name: Release Notes und Entwurf
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
      body: ${{ steps.body.outputs.body }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Abschnitt aus CHANGELOG.md
        id: body
        run: |
          node scripts/notes.mjs "${GITHUB_REF_NAME}" > notes.md
          { echo 'body<<NOTES_EOF'; cat notes.md; echo 'NOTES_EOF'; } >> "$GITHUB_OUTPUT"
      - name: Entwurf einmal anlegen (alle Builds laden dorthin hoch)
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ID direkt aus der Antwort: ein frischer Entwurf erscheint nicht sofort in der Release-Liste.
          id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="${GITHUB_REF_NAME}" -f name="Mitgliederverwaltung ${GITHUB_REF_NAME}" \
            -F draft=true -F body=@notes.md --jq .id)
          test -n "${id}"
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  handbuch:
    name: Handbuch als PDF
    needs: notes
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Abhängigkeiten
        run: pnpm install --frozen-lockfile
      - name: PDF erzeugen (Chrome ist auf dem Runner vorinstalliert)
        run: node scripts/handbuch-pdf.mjs --out Handbuch.pdf --version "${GITHUB_REF_NAME#v}"
      - name: An den Entwurf hängen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.notes.outputs.release_id }}
        run: |
          # Bei einem erneuten Lauf existiert das PDF schon (sonst 422): vorher entfernen.
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name == "Handbuch.pdf") | .id')
          if [ -n "$existing" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${existing}"
          fi
          # Upload über die Release-ID: funktioniert auch für Entwürfe (anders als per Tag).
          gh api -X POST \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=Handbuch.pdf" \
            -H "Content-Type: application/pdf" --input Handbuch.pdf --jq .name

  build:
    name: Installer (${{ matrix.name }})
    needs: notes
    strategy:
      fail-fast: false
      # Nacheinander: jeder Build ergänzt latest.json; parallel könnten sich Einträge überschreiben.
      max-parallel: 1
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux-Pakete für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: Abhängigkeiten
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ui install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Analysedaten (befristet): wird beim Build eingebaut, erscheint nie im Code oder Protokoll.
          MV_DIAGNOSE_WEBHOOK: ${{ secrets.DIAGNOSE_WEBHOOK_URL }}
        with:
          projectPath: .
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.notes.outputs.release_id }}
          # Text für „Was ist neu?“ im Update-Hinweis des Programms (latest.json → notes).
          releaseBody: ${{ needs.notes.outputs.body }}
          includeUpdaterJson: true
