name: Bildschirmfotos

# Von Hand starten, wenn sich die Oberfläche sichtbar geändert hat.
# Danach lokal: node scripts/bildschirmfotos.mjs (holt die Bilder) und committen.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fotos:
    name: Bildschirmfotos fürs Handbuch
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux-Pakete für Tauri und WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev webkit2gtk-driver xvfb

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Abhängigkeiten
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir e2e install --frozen-lockfile

      - name: tauri-driver
        run: cargo install tauri-driver --locked

      - name: Beispieldaten
        run: cargo run -q -p verwaltung_core --example beispieldaten -- "$RUNNER_TEMP/beispiel.sqlite"

      - name: Musterliste für den Import
        run: cargo run -q -p verwaltung_core --example musterliste -- "$RUNNER_TEMP/musterliste.xlsx"

      - name: Programm bauen (Debug)
        run: pnpm tauri build --debug --no-bundle

      - name: Bildschirmfotos aufnehmen
        env:
          BEISPIEL_DB: ${{ runner.temp }}/beispiel.sqlite
          MUSTERLISTE: ${{ runner.temp }}/musterliste.xlsx
          LEERE_DB: ${{ runner.temp }}/leer.sqlite
        run: |
          rm -f docs/handbuch/bilder/*.png
          xvfb-run --server-args="-screen 0 1280x800x24" pnpm --dir e2e bildschirmfotos

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bildschirmfotos
          path: docs/handbuch/bilder/*.png
          if-no-files-found: error
