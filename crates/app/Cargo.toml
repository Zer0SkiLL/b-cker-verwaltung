[package]
name = "verwaltung_app"
version = "0.3.2"
edition = "2021"
description = "Mitgliederverwaltung – Desktop-Programm"

[lib]
name = "verwaltung_app"
path = "src/lib.rs"

[[bin]]
name = "mitgliederverwaltung"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
os_info = { version = "3", default-features = false }
tauri-plugin-log = "2"
verwaltung_core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
gethostname = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.43", features = ["bundled", "chrono"] }

[dev-dependencies]
tempfile = "3"
rust_xlsxwriter = "0.104"
calamine = "0.38"
