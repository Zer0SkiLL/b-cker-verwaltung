[package]
name = "verwaltung_core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
csv = "1"
rust_xlsxwriter = "0.104"
calamine = { version = "0.38", features = ["dates"] }

[dev-dependencies]
tempfile = "3"
